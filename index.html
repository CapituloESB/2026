<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XV Congreso ESB Barcelona</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Mulish:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   COLORES: cambia aquí y se aplican a toda la web.
   ===================================================================== */
:root{
  --bg:#FFFFFF;          /* fondo de la página */
  --tint:#EEF8F8;        /* fondos suaves (tarjetas destacadas) */
  --surface:#FFFFFF;     /* tarjetas */
  --ink:#0F1A1B;         /* texto */
  --muted:#5A7275;       /* texto secundario */
  --line:#D6E8E8;        /* líneas */
  --brand:#0C9A96;       /* turquesa del congreso */
  --brand-deep:#0A6B6E;  /* turquesa oscuro */
  --brand-ink:#FFFFFF;   /* texto sobre turquesa */
  --soft:#D9F3F2;        /* turquesa muy claro */
  --live:#E0552F;        /* "Ahora" y sala marcada en el plano */
  --live-soft:#FDEAE4;
  --f-display:"Montserrat","Avenir Next",system-ui,sans-serif;
  --f-body:"Mulish",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabecera */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:3px solid var(--brand)}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.logo-head{flex:none;height:54px;width:64px;display:grid;place-items:center;overflow:hidden}
.logo-head img{display:block;width:100%;height:100%;object-fit:contain}
.logo-head .ph{width:54px;height:54px;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;font-size:10px;color:var(--muted);text-transform:uppercase}
.brand-text{min-width:0}
h1{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.05;margin:0;letter-spacing:-.01em;color:var(--ink)}
h1 span{color:var(--brand)}
.brand-sub{font-size:12px;color:var(--muted);line-height:1.3;margin-top:3px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:7px 13px;border-radius:99px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;font-family:var(--f-display)}
nav button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);display:inline-block;flex:none}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 1.6s infinite}}
@keyframes pulse{50%{opacity:.3}}

main{padding-block:18px 40px}
.view{display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;color:var(--brand-deep);text-wrap:balance}
h3{font-family:var(--f-display)}
.sub{color:var(--muted);font-size:13px;margin:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Simulador */
.sim{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--tint);padding:10px 12px;border-radius:var(--r);font-size:13px}
.sim select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font:inherit;color:var(--ink)}
.sim input{width:100%;accent-color:var(--brand)}
.sim output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.sim p{grid-column:1/-1;margin:0;color:var(--muted);font-size:12px}

/* Ahora */
.now{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--live);box-shadow:0 2px 10px rgba(10,107,110,.06)}
.now .tag{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--live);text-transform:uppercase;letter-spacing:.06em}
.now h3{font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
.next{background:var(--tint);border-radius:var(--r);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.next strong{display:block;font-weight:700;line-height:1.3}
.next > div{min-width:0}

/* Programa */
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.block-title{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--brand);text-transform:uppercase;letter-spacing:.06em;margin-top:10px}
.list{display:flex;flex-direction:column;border-top:2px solid var(--brand)}
.row{display:grid;grid-template-columns:58px 1fr;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.row.live{background:linear-gradient(90deg,var(--live-soft),transparent 75%);margin-inline:-10px;padding-inline:10px;border-radius:8px}
.t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;line-height:1.35;color:var(--brand-deep);font-weight:600}
.t span{display:block;color:var(--muted);font-size:12px;font-weight:400}
.body{min-width:0;display:flex;flex-direction:column;gap:6px}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kind .now-pill{color:var(--live);display:inline-flex;gap:5px;align-items:center}
.title{font-weight:700;font-size:16px;line-height:1.3}
.row.break .title{font-weight:600;color:var(--muted)}
.meta{font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:700;text-decoration:none;line-height:1.3}
.btn svg{width:14px;height:14px;flex:none}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost{border-color:transparent;background:none;color:var(--brand);padding-inline:4px}
.tracks{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--surface);font-weight:600}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.choice{display:flex;flex-direction:column;gap:6px;background:var(--tint);border-radius:10px;padding:10px 12px}
.choice b{font-weight:700;line-height:1.3}

/* Pestañas de sesiones */
.tk-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:600px){.tk-tabs.n4{grid-template-columns:repeat(4,minmax(0,1fr))}.tk-tabs.n3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tk{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tk .code{font-family:var(--f-display);font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.tk .nm{font-size:12px;line-height:1.3;font-weight:600}
.tk .rm{font-size:12px;color:var(--muted)}
.tk[aria-selected="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:var(--tint)}
.tk .mine{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--brand)}

/* Buscar */
.search input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px}
.res{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.hit{padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.hit .ttl{font-weight:700;line-height:1.3}
.hit mark{background:var(--live-soft);color:inherit;border-radius:2px}
.empty{color:var(--muted);text-align:center;padding:20px 8px;margin:0}

/* Mapa: imagen del plano + recuadros encima */
.where{display:flex;flex-direction:column;gap:4px;background:var(--tint);border-radius:var(--r);padding:14px 16px;border-left:4px solid var(--live)}
.where.idle{border-left-color:var(--brand)}
.where strong{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.15}
.where .row2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.legend button[aria-pressed="true"]{border-color:var(--live);background:var(--live);color:#fff}
.floor{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:140px}
.plan{position:relative;width:100%;line-height:0}
.plan img{width:100%;height:auto;display:block}
.hot{position:absolute;border:0;background:transparent;padding:0;border-radius:4px}
.hot:hover{box-shadow:0 0 0 2px var(--brand)}
.hot.on{background:rgba(224,85,47,.28);box-shadow:0 0 0 3px var(--live)}
.hot.stairs.on{background:rgba(224,85,47,.45)}
@media (prefers-reduced-motion:no-preference){.hot.on::after{content:"";position:absolute;inset:0;border-radius:6px;animation:ring 1.4s ease-out infinite}}
@keyframes ring{0%{box-shadow:0 0 0 3px rgba(224,85,47,.8)}100%{box-shadow:0 0 0 16px rgba(224,85,47,0)}}
.ext{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ext > div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.ext > div > div{min-width:0}
.ext b{display:block}

/* Hoja de sesión */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(4,30,32,.45)}
.panel{position:relative;background:var(--surface);width:100%;max-width:760px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;
  padding-top:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.close{border:0;background:var(--tint);border-radius:50%;width:36px;height:36px;font-size:20px;flex:none;line-height:1}
.sess{display:flex;flex-direction:column;gap:2px}
.sess .title{font-family:var(--f-display);font-size:17px}
.talks{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.talk{display:grid;grid-template-columns:54px 1fr;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.talk.noid{grid-template-columns:1fr}
.talk .id{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.talk .ttl{font-weight:600;line-height:1.35}
.talk .who{font-size:13px;color:var(--muted);font-style:italic;line-height:1.4}
.talk .btn.abs{margin-top:6px;padding:4px 10px;font-size:12px}
.talk .desc{font-size:13px;line-height:1.5;margin-top:4px}
.panel .actions{position:sticky;bottom:0;background:var(--surface);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}

/* Pie con logos */
footer{border-top:1px solid var(--line);background:var(--bg)}
footer .wrap{padding-block:24px 32px;display:flex;flex-direction:column;gap:14px}
.logos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:center}
@media (min-width:600px){.logos{grid-template-columns:repeat(3,minmax(0,1fr))}}
.logo{height:72px;padding:8px;overflow:hidden;min-width:0}
.logo img{display:block;width:100%;height:100%;object-fit:contain}
.logo.ph{display:grid;place-items:center;border:1.5px dashed var(--line);border-radius:10px;font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.contact{font-size:13px;color:var(--muted);margin:0}
.contact span{color:var(--ink);font-weight:700;user-select:all}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <div class="logo-head" id="logo-head"></div>
      <div class="brand-text">
        <h1>XV Congreso <span>ESB</span></h1>
        <div class="brand-sub">Capítulo Nacional Español de la Sociedad Europea de Biomecánica · 29–30 oct 2026 · ETSEIB Barcelona</div>
      </div>
    </div>
    <nav role="tablist" aria-label="Secciones">
      <button role="tab" data-tab="ahora"><span class="dot"></span>Ahora</button>
      <button role="tab" data-tab="jueves">Jueves 29</button>
      <button role="tab" data-tab="viernes">Viernes 30</button>
      <button role="tab" data-tab="mapa">Mapa</button>
      <button role="tab" data-tab="buscar">Buscar</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="v-ahora" class="view" hidden></section>
  <section id="v-jueves" class="view" hidden></section>
  <section id="v-viernes" class="view" hidden></section>
  <section id="v-mapa" class="view" hidden></section>
  <section id="v-buscar" class="view" hidden>
    <h2>Buscar ponencia o autor</h2>
    <div class="search"><input id="q" type="search" placeholder="Apellido, título o ID (p. ej. 141014)" autocomplete="off" aria-label="Buscar"></div>
    <div id="results"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="eyebrow">Organizan</div>
    <div class="logos" id="logos-org"></div>
    <div class="eyebrow">Colaboran</div>
    <div class="logos" id="logos-col"></div>
    <p class="contact">Contacto: <span>capitulo.esb@event.upc.edu</span></p>
  </div>
</footer>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="panel-head">
      <div><div class="eyebrow" id="sh-time"></div><h2 id="sh-title"></h2></div>
      <button class="close" data-close aria-label="Cerrar">×</button>
    </div>
    <div class="tk-tabs" id="sh-tabs" role="tablist"></div>
    <div class="sess" id="sh-meta"></div>
    <div class="talks" id="sh-talks"></div>
    <div class="actions" id="sh-actions"></div>
  </div>
</div>

<!-- Todos los datos (programa, salas, logos, planos) están en programa.js -->
<script src="programa.js"></script>
<script>
const KIND = {general:"General", plenary:"Plenario", break:"Pausa", parallel:"Sesiones paralelas", session:"Sesión"};
const toMin = s => { const [h,m]=s.split(":").map(Number); return h*60+m; };
const fmt = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const $ = s => document.querySelector(s);
const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const EXTI = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
const mapsURL = k => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(EXT[k].name + ", " + EXT[k].addr);
const sw = room => `<i class="sw" style="background:${ROOM_COLOR[room]||"var(--brand)"}"></i>`;
const roomName = r => ROOMS[r] ? ROOMS[r].name : "";
const mapBtn = (room, label, primary) => `<button class="btn${primary?" primary":""}" data-map="${room}">${PIN}${esc(label || roomName(room))}</button>`;
const extBtn = k => `<a class="btn" href="${mapsURL(k)}" target="_blank" rel="noopener">${EXTI}Abrir en Google Maps</a>`;

/* Logos: si el archivo no existe, se muestra una caja con el nombre */
function logoHTML(l){ return `<div class="logo"><img src="${esc(l.archivo)}" alt="${esc(l.nombre)}" onerror="this.parentNode.classList.add('ph');this.parentNode.textContent=this.alt"></div>`; }
$("#logo-head").innerHTML = `<img src="${esc(LOGOS.cabecera)}" alt="Logo del congreso" onerror="this.outerHTML='<div class=ph>Logo</div>'">`;
$("#logos-org").innerHTML = LOGOS.organizan.map(logoHTML).join("");
$("#logos-col").innerHTML = LOGOS.colaboran.map(logoHTML).join("");

/* Elecciones de cada persona (se guardan solo en su móvil) */

/* Modo prueba (solo para organizadores):
   ?simular                    → aparece la barra para mover el día y la hora
   ?hora=2026-10-29T16:30      → la web se comporta como si fuera ese momento (y el reloj avanza) */
const PARAMS = new URLSearchParams(location.search);
const T0 = Date.now();
const FAKE = PARAMS.get("hora") ? new Date(PARAMS.get("hora")) : null;
const nowDate = () => (FAKE && !isNaN(FAKE)) ? new Date(FAKE.getTime() + (Date.now() - T0)) : new Date();
const isoOf = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function phase(){
  const iso = isoOf(nowDate()), ds = Object.values(CONGRESS_DATES).sort();
  return iso < ds[0] ? "antes" : iso > ds[ds.length-1] ? "despues" : "durante";
}
function realNow(){
  const d = nowDate();
  const iso = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const day = Object.keys(CONGRESS_DATES).find(k => CONGRESS_DATES[k]===iso);
  return day ? { day, min:d.getHours()*60+d.getMinutes() } : null;
}
const live = realNow();
const SIMULAR = PARAMS.has("simular");
const state = { tab:"ahora", now: live || { day:"jueves", min:toMin("16:30") }, simulated: !live && SIMULAR, mapRoom:null, back:null, sheet:null };

const isLive = (day,it) => (live || state.simulated) && state.now.day===day && state.now.min>=toMin(it.start) && state.now.min<toMin(it.end);
const trackOf = (it,code) => it.tracks.find(t=>t.code===code);
function findItem(id){ for (const d in PROGRAM){ const it = PROGRAM[d].items.find(i=>i.id===id); if (it) return {day:d,it}; } }

/* ---------- Programa ---------- */
function rowHTML(day,it){
  const lv = isLive(day,it);
  let extra = "";
  if (it.kind==="parallel"){
    extra = `<div class="tracks">${it.tracks.map(t=>`<span class="chip">${sw(t.room)}${t.code} · ${esc(roomName(t.room))}</span>`).join("")}</div>`;
    extra += `<div class="actions"><button class="btn primary" data-open="${it.id}">Ver sesiones y ponencias</button></div>`;
  } else {
    if (it.meta) extra += `<div class="meta">${esc(it.meta)}</div>`;
    const room = it.room || (it.tracks && it.tracks[0].room);
    const btns = [];
    if (it.kind==="session") btns.push(`<button class="btn primary" data-open="${it.id}">Ver detalles</button>`);
    if (room) btns.push(mapBtn(room));
    if (it.ext) btns.push(extBtn(it.ext));
    if (btns.length) extra += `<div class="actions">${btns.join("")}</div>`;
  }
  return `${it.block?`<div class="block-title">${esc(it.block)}</div>`:""}<div class="row ${it.kind}${lv?" live":""}">
    <div class="t">${it.start}${it.open?"":`<span>${it.end}</span>`}</div>
    <div class="body">
      <div class="kind">${KIND[it.kind]}${lv?'<span class="now-pill"><span class="dot"></span>Ahora</span>':""}</div>
      <div class="title">${esc(it.title)}</div>${extra}
    </div></div>`;
}
function renderDay(day){
  const d = PROGRAM[day];
  $("#v-"+day).innerHTML = `<div class="day-head"><h2>${d.label}</h2><p class="sub">${d.date}</p></div>
    <div class="list">${d.items.map(it=>rowHTML(day,it)).join("")}</div>`;
}

/* ---------- Ahora ---------- */
function renderNow(){
  if (!live && !state.simulated){
    const first = PROGRAM.jueves.items[0];
    $("#v-ahora").innerHTML = phase()==="antes"
      ? `<div class="now" style="border-top-color:var(--brand)"><div class="tag" style="color:var(--brand)">Próximamente</div>
          <h3>El congreso empieza el jueves 29 de octubre</h3>
          <p class="sub">Primera actividad: ${esc(first.title)} a las ${first.start}. Durante el congreso, esta pantalla te mostrará en cada momento qué toca y dónde.</p>
          <div class="actions"><button class="btn primary" data-tab="jueves">Ver el programa</button>${first.room?mapBtn(first.room):""}</div></div>`
      : `<div class="now" style="border-top-color:var(--brand)"><div class="tag" style="color:var(--brand)">Gracias por venir</div>
          <h3>El XV Congreso ESB ha terminado</h3>
          <p class="sub">Puedes seguir consultando el programa y las ponencias.</p>
          <div class="actions"><button class="btn primary" data-tab="jueves">Ver el programa</button><button class="btn" data-tab="buscar">Buscar ponencias</button></div></div>`;
    return;
  }
  const {day,min} = state.now;
  const items = PROGRAM[day].items;
  const curs = items.filter(i => min>=toMin(i.start) && min<toMin(i.end)); /* puede haber varias a la vez */
  const nxt = items.find(i => toMin(i.start) > min);
  let html = "";
  if (state.simulated){
    html += `<div class="sim">
      <select id="sim-day" aria-label="Día">${Object.keys(PROGRAM).map(k=>`<option value="${k}"${k===day?" selected":""}>${PROGRAM[k].label}</option>`).join("")}</select>
      <input id="sim-time" type="range" min="480" max="1380" step="5" value="${min}" aria-label="Hora">
      <output>${fmt(min)}</output>
      <p>Modo prueba: mueve la barra para ver qué saldría a cada hora. Los asistentes no ven esta barra.</p></div>`;
  }
  if (!curs.length){
    html += `<div class="now"><div class="tag">Ahora</div><p class="sub">No hay ninguna actividad a esta hora.</p></div>`;
  }
  for (const cur of curs){
  if (cur.kind==="parallel"){
    html += `<div class="now"><div class="tag"><span class="dot"></span>Ahora · hasta las ${cur.end}</div>
      <h3>${esc(cur.title)}</h3>
      <p class="sub">Hay ${cur.tracks.length} sesiones a la vez. Toca una para ver las ponencias y la sala.</p>
      <div class="tk-tabs n${cur.tracks.length}">${cur.tracks.map(t=>`<button class="tk" data-open="${cur.id}" data-track="${t.code}">
        <span class="code">${sw(t.room)}${t.code}</span><span class="nm">${esc(t.name)}</span><span class="rm">${esc(roomName(t.room))}</span></button>`).join("")}</div>
    </div>`;
  } else {
    const room = cur.room || (cur.tracks && cur.tracks[0].room);
    const btns = [];
    if (room) btns.push(mapBtn(room,"Ir a "+roomName(room),true));
    if (cur.ext) btns.push(extBtn(cur.ext));
    if (cur.kind==="session") btns.push(`<button class="btn" data-open="${cur.id}">Ver detalles</button>`);
    html += `<div class="now"><div class="tag"><span class="dot"></span>Ahora${cur.open?"":" · hasta las "+cur.end}</div>
      <h3>${esc(cur.title)}</h3>${cur.meta?`<p class="sub">${esc(cur.meta)}</p>`:""}
      ${btns.length?`<div class="actions">${btns.join("")}</div>`:""}</div>`;
  }
  }
  if (nxt){
    const room = nxt.room || (nxt.tracks && nxt.kind!=="parallel" && nxt.tracks[0].room);
    const where = nxt.kind==="parallel" ? `${nxt.tracks.length} salas` : room ? roomName(room) : nxt.ext ? EXT[nxt.ext].name : "";
    const btn = nxt.kind==="parallel" ? `<button class="btn" data-open="${nxt.id}">Ver</button>` : room ? mapBtn(room,"Ver") : nxt.ext ? `<a class="btn" href="${mapsURL(nxt.ext)}" target="_blank" rel="noopener">${EXTI}Maps</a>` : "";
    html += `<div class="next"><div><div class="eyebrow">A continuación · ${nxt.start}</div><strong>${esc(nxt.title)}</strong>${where?`<span class="meta">${esc(where)}</span>`:""}</div>${btn}</div>`;
  }
  $("#v-ahora").innerHTML = html;
  const sd = $("#sim-day"), st = $("#sim-time");
  if (sd){
    sd.onchange = () => { state.now.day = sd.value; renderAll(); };
    st.oninput = () => { state.now.min = +st.value; renderNow(); renderDay("jueves"); renderDay("viernes"); $("#sim-time").focus(); };
  }
}

/* ---------- Mapa ---------- */
const box = p => `left:${p[0]}%;top:${p[1]}%;width:${p[2]}%;height:${p[3]}%`;
function planHTML(key, sel){
  const P = PLANOS[key];
  const target = sel && ROOMS[sel];
  const needStairs = target && target.plano!==PLANOS_FIRST;
  const hots = Object.entries(ROOMS).filter(([,r])=>r.plano===key).map(([k,r])=>
    `<button class="hot${k===sel?" on":""}" style="${box(r.pos)}" data-room="${k}" aria-label="${esc(r.name)}"></button>`).join("");
  const stairs = P.escalera ? `<span class="hot stairs${needStairs?" on":""}" style="${box(P.escalera)}"></span>` : "";
  return `<div class="floor" id="plan-${key}"><div class="eyebrow">${esc(P.nombre)}</div>
    <div class="plan"><img src="${esc(P.imagen)}" alt="Plano ${esc(P.nombre)}">${stairs}${hots}</div></div>`;
}
const PLANOS_FIRST = Object.keys(PLANOS)[0];
function renderMap(){
  const sel = state.mapRoom, r = sel && ROOMS[sel];
  $("#v-mapa").innerHTML = `
    <div class="where${r?"":" idle"}">
      <div class="row2"><div class="eyebrow">${r?"Tienes que ir a":"Plano de la ETSEIB"}</div>${state.back?`<button class="btn" id="back">← Volver</button>`:""}</div>
      <strong>${r?esc(r.name):"Elige una sala"}</strong>
      <span class="meta">${r?esc(r.hint):"Toca un botón o una sala del plano."}</span>
    </div>
    <div class="legend">${ROOMS_LEGEND.map(k=>`<button data-room="${k}" aria-pressed="${k===sel}">${esc(ROOMS[k].name)}</button>`).join("")}</div>
    ${Object.keys(PLANOS).map(k=>planHTML(k,sel)).join("")}
    <div><div class="eyebrow" style="margin-bottom:6px">Fuera del edificio</div>
    <div class="ext">${Object.keys(EXT).map(k=>`<div><div><b>${esc(EXT[k].name)}</b><span class="meta">${esc(EXT[k].addr)}</span></div><a class="btn" href="${mapsURL(k)}" target="_blank" rel="noopener">${EXTI}Maps</a></div>`).join("")}</div></div>`;
  const b = $("#back"); if (b) b.onclick = () => { const t = state.back; state.back = null; go(t); };
}
function scrollToPlan(){
  const r = state.mapRoom && ROOMS[state.mapRoom];
  if (r && r.plano!==PLANOS_FIRST){ const el = $("#plan-"+r.plano); if (el) el.scrollIntoView({block:"start"}); }
}

/* ---------- Hoja de sesión ---------- */
function openSheet(id, code){
  const {it} = findItem(id);
  state.sheet = { id, code: code || it.tracks[0].code };
  renderSheet(); $("#sheet").hidden = false; $(".panel").scrollTop = 0; $(".close").focus();
}
function renderSheet(){
  const {id,code} = state.sheet; const {day,it} = findItem(id); const t = trackOf(it,code);
  const par = it.kind==="parallel";
  $("#sh-time").textContent = `${PROGRAM[day].label} · ${it.start}–${it.end}`;
  $("#sh-title").textContent = it.title;
  const tabs = $("#sh-tabs");
  tabs.hidden = !par;
  tabs.className = "tk-tabs n"+it.tracks.length;
  tabs.innerHTML = par ? it.tracks.map(x=>`<button class="tk" role="tab" data-tk="${x.code}" aria-selected="${x.code===code}">
     <span class="code">${sw(x.room)}${x.code}</span><span class="rm">${esc(roomName(x.room))}</span></button>`).join("") : "";
  $("#sh-meta").innerHTML = `<div class="title">${esc(t.name)}</div><div class="meta">${[t.chair, roomName(t.room)].filter(Boolean).map(esc).join(" · ")}</div>`;
  $("#sh-talks").innerHTML = t.talks.map(([tid,ti,who,desc])=>`<div class="talk${tid?"":" noid"}">${tid?`<div class="id">${esc(tid)}</div>`:""}<div><div class="ttl">${esc(ti)}</div>${who?`<div class="who">${esc(who)}</div>`:""}${desc?`<div class="desc">${esc(desc)}</div>`:""}${tid?`<div data-abs="${esc(tid)}"></div>`:""}</div></div>`).join("");
  checkAbstracts();
  const goBtn = `<button class="btn primary" data-sh-map>${PIN}Ir a ${esc(roomName(t.room))}</button>`;
  $("#sh-actions").innerHTML = goBtn;
}
/* Abstracts: si existe abstracts/ID.pdf, aparece el botón. Si no, no se muestra nada. */
const PDFI = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>';
const absCache = {};
function checkAbstracts(){
  document.querySelectorAll("[data-abs]").forEach(el=>{
    const id = el.dataset.abs, url = ABSTRACTS_CARPETA + id + ".pdf";
    const show = ok => { if (ok) el.innerHTML = `<a class="btn abs" href="${esc(url)}" target="_blank" rel="noopener">${PDFI}Abstract (PDF)</a>`; };
    if (id in absCache) return show(absCache[id]);
    fetch(url,{method:"HEAD",cache:"no-store"}).then(r=>{ absCache[id]=r.ok; show(r.ok); }).catch(()=>{ absCache[id]=false; });
  });
}
function closeSheet(){ $("#sheet").hidden = true; state.sheet = null; }

/* ---------- Buscar ---------- */
const INDEX = [];
for (const day in PROGRAM) for (const it of PROGRAM[day].items){
  if (!it.tracks) continue;
  for (const t of it.tracks) for (const [tid,ti,who] of t.talks)
    INDEX.push({day,it,t,tid,ti,who,key:norm([tid,ti,who,t.code,t.name].join(" "))});
}
function hl(text,q){
  if (!q) return esc(text);
  const i = norm(text).indexOf(q);
  if (i<0) return esc(text);
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
function renderSearch(){
  const raw = $("#q").value.trim(), q = norm(raw), out = $("#results");
  if (q.length<2){ out.innerHTML = `<p class="empty">Escribe al menos dos letras. Busca entre ${INDEX.length} ponencias.</p>`; return; }
  const hits = INDEX.filter(x=>x.key.includes(q)).slice(0,60);
  if (!hits.length){ out.innerHTML = `<p class="empty">No hay resultados para «${esc(raw)}».</p>`; return; }
  out.innerHTML = `<div class="res">${hits.map(h=>`<div class="hit">
    <div class="meta">${sw(h.t.room)} ${PROGRAM[h.day].label} · ${h.it.start} · ${esc(roomName(h.t.room))} · ${h.it.kind==="parallel"?h.t.code:esc(h.it.title)}</div>
    <div class="ttl">${hl(h.ti,q)}</div>${h.who?`<div class="meta" style="font-style:italic">${hl(h.who,q)}</div>`:""}
    <div class="actions"><button class="btn" data-open="${h.it.id}" data-track="${h.t.code}">Ver sesión</button>${mapBtn(h.t.room)}</div></div>`).join("")}</div>`;
}
$("#q").addEventListener("input", renderSearch);

/* ---------- Navegación ---------- */
const TABS = ["ahora","jueves","viernes","mapa","buscar"];
function go(tab){
  state.tab = tab;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  document.querySelectorAll(".view").forEach(v=>v.hidden = v.id!=="v-"+tab);
  if (tab==="mapa") renderMap();
  if (tab==="buscar") renderSearch();
  try { history.replaceState(null,"","#"+tab); } catch(e){}
  window.scrollTo(0,0);
}
function showOnMap(room){
  if (state.tab!=="mapa") state.back = state.tab;
  state.mapRoom = room; go("mapa"); scrollToPlan();
}
function renderAll(){ renderNow(); renderDay("jueves"); renderDay("viernes"); if (state.tab==="mapa") renderMap(); }

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-tab],[data-map],[data-open],[data-room],[data-tk],[data-close],[data-sh-map]");
  if (!el) return;
  const d = el.dataset;
  if (d.tab){ state.back=null; go(d.tab); }
  else if (d.map){ closeSheet(); showOnMap(d.map); }
  else if (d.open){ openSheet(d.open, d.track); }
  else if (d.room){ state.mapRoom = d.room; renderMap(); scrollToPlan(); }
  else if (d.tk){ state.sheet.code = d.tk; renderSheet(); $(".panel").scrollTop = 0; }
  else if ("close" in d){ closeSheet(); }
  else if ("shMap" in d){ const {it} = findItem(state.sheet.id); const r = trackOf(it,state.sheet.code).room; closeSheet(); showOnMap(r); }
});
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && state.sheet) closeSheet(); });

if (live) setInterval(()=>{ const n = realNow(); if (n){ state.now = n; renderAll(); } }, 60000);

renderAll();
/* Enlaces directos: #mapa abre el plano; #mapa-capella abre el plano con esa sala marcada */
const h0 = location.hash.slice(1);
const salaQR = h0.startsWith("mapa-") && h0.slice(5);
if (salaQR && ROOMS[salaQR]) { state.mapRoom = salaQR; go("mapa"); scrollToPlan(); }
else go(TABS.includes(h0) ? h0 : "ahora");
</script>
</body>
</html>
